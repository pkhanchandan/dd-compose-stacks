# Task 4: one project assembled from two awesome-compose samples with `include`,
# plus one service of its own.
name: app-with-monitoring

include:
  # The app: proxy, backend, db. The study overlay adds healthchecks and pins postgres:17.
  - path:
      - ../01-fullstack-app/vendor/nginx-golang-postgres/compose.yaml
      - ../01-fullstack-app/compose.study.yaml
  # Monitoring: prometheus, grafana. The overlay pins Prometheus 2.x (3.x rejects the sample's config).
  - path:
      - ../02-busy-environment/vendor/prometheus-grafana/compose.yaml
      - compose.prometheus-pin.yaml

services:
  # This file's own service: a DB browser for the included app's database.
  adminer:
    image: adminer:latest
    ports:
      - 8081:8080
    environment:
      - ADMINER_DEFAULT_SERVER=db
    depends_on:
      db:
        condition: service_healthy
