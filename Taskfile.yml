version: '3'

includes:
  app:
    taskfile: 01-fullstack-app/Taskfile.yml
    dir: 01-fullstack-app
  busy:
    taskfile: 02-busy-environment/Taskfile.yml
    dir: 02-busy-environment
  included:
    taskfile: 03-included-project/Taskfile.yml
    dir: 03-included-project

tasks:
  default:
    cmds:
      - task --list

  prewarm:
    desc: Pull and build everything once, so sessions never wait on downloads
    cmds:
      - task: app:pull
      - task: busy:pull
      - task: included:pull

  task1:
    desc: "Task 1 setup state: a healthy 3-service stack plus one standalone container"
    cmds:
      - task: app:up

  task2:
    desc: "Task 2 setup state: Task 1 state, plus stopped stacks, unused large images, and a CPU-hungry container"
    cmds:
      - task: app:up
      - task: busy:up

  task3:
    desc: "Task 3 setup state: the app's db crash-loops on a misspelled env var (run after task1 or task2)"
    cmds:
      - task: app:break

  task3:undo:
    desc: Put the app back to its healthy Task 1 state
    cmds:
      - task: app:fix

  task4:
    desc: "Task 4 setup state: one project that includes two compose files and adds a service (resets everything else first)"
    cmds:
      - task: reset
      - task: included:up

  reset:
    desc: Remove all study containers and volumes (keeps pulled images so the next setup is fast)
    cmds:
      - task: included:down
      - task: busy:down
      - task: app:down

  gui:v2:
    desc: Switch Docker Desktop to GUI v2 (quit Docker Desktop first; backs up current settings)
    cmds:
      - bash ./settings-scripts/set-docker-gui.sh

  gui:restore:
    desc: Restore Docker Desktop's settings from before gui:v2 (quit Docker Desktop first)
    cmds:
      - bash ./settings-scripts/restore-docker-gui.sh

  status:
    desc: Show what is currently set up
    cmds:
      - docker compose ls -a
      - docker ps -a --format 'table {{"{{"}}.Names{{"}}"}}\t{{"{{"}}.Status{{"}}"}}'
      - docker system df
